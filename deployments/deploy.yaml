version: 2
defaultProfile: cloud.production
profiles:
  cloud.production:
    deployment:
      deploymentProfile: cloud
      environment: production
      deliveryKind: container-image
      deploymentDriver: kubernetes
      managementModel: sdkwork-managed
      tenancyModel: multi-tenant
      isolationModel: shared
      networkExposure: public
      rolloutStrategy: rolling
      availabilityMode: high-availability
    install:
      layout: binary-package
    expose:
      - domain: aiot-admin.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.sdkwork.com
          - aiot.sdkwork.com
          - edge.aiot.sdkwork.com
      - domain: aiot-admin.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.birdcoder.com
          - aiot.birdcoder.com
          - edge.aiot.birdcoder.com
      - domain: aiot-admin.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.dtupay.com
          - aiot.dtupay.com
          - edge.aiot.dtupay.com
      - domain: aiot-admin.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.sdkwork.cn
          - aiot.sdkwork.cn
          - edge.aiot.sdkwork.cn
      - domain: aiot-admin.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.birdcoder.cn
          - aiot.birdcoder.cn
          - edge.aiot.birdcoder.cn
      - domain: aiot-admin.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.dtupay.cn
          - aiot.dtupay.cn
          - edge.aiot.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: cloud.production
        env: etc/topology/cloud.production.env
  standalone.production:
    deployment:
      deploymentProfile: standalone
      environment: production
      deliveryKind: host-package
      deploymentDriver: nginx
      managementModel: customer-managed
      tenancyModel: single-tenant
      isolationModel: dedicated
      networkExposure: private
      rolloutStrategy: recreate
      availabilityMode: single-instance
    install:
      layout: binary-package
    expose:
      - domain: aiot-admin.sdkwork.com
        tls: sdkwork.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.sdkwork.com
          - aiot.sdkwork.com
          - edge.aiot.sdkwork.com
      - domain: aiot-admin.birdcoder.com
        tls: birdcoder.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.birdcoder.com
          - aiot.birdcoder.com
          - edge.aiot.birdcoder.com
      - domain: aiot-admin.dtupay.com
        tls: dtupay.com
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.dtupay.com
          - aiot.dtupay.com
          - edge.aiot.dtupay.com
      - domain: aiot-admin.sdkwork.cn
        tls: sdkwork.cn
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.sdkwork.cn
          - aiot.sdkwork.cn
          - edge.aiot.sdkwork.cn
      - domain: aiot-admin.birdcoder.cn
        tls: birdcoder.cn
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.birdcoder.cn
          - aiot.birdcoder.cn
          - edge.aiot.birdcoder.cn
      - domain: aiot-admin.dtupay.cn
        tls: dtupay.cn
        mode: web+api
        web: adaptive
        apiPathStyle: full-prefix
        aliases:
          - aiot-app.dtupay.cn
          - aiot.dtupay.cn
          - edge.aiot.dtupay.cn
    packages: []
    overrides:
      topology:
        spec: specs/topology.spec.json
        profile: standalone.production
        env: etc/topology/standalone.production.env
      proxy:
        upstreams:
          application.public-ingress: http://127.0.0.1:3900
          platform.api-gateway: http://127.0.0.1:3900
